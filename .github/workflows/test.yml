name: tests
on:
  push:
  workflow_dispatch:

# Note, this comes from https://github.com/oclif/github-workflows/blob/main/.github/workflows/unitTest.yml because I couldn't figure out how to make `env` work with the default content from oclif
#
# jobs:
#   unit-tests:
#     uses: oclif/github-workflows/.github/workflows/unitTest.yml@main
#
jobs:
  unit-tests:
    env:
      QUONFIG_DOMAIN: quonfig-staging.com
      QUONFIG_INTEGRATION_TEST_ENCRYPTION_KEY: ${{ secrets.QUONFIG_INTEGRATION_TEST_ENCRYPTION_KEY }}
      FAKE_PROD_SECRET: ${{ secrets.FAKE_PROD_SECRET }}
      NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    strategy:
      matrix:
        # windows-latest re-added (qfg-qilt): the failures were all test-fixture
        # artifacts (POSIX-path literals, CRLF round-trips, slow-git timeout) —
        # fixed in test/setup.ts + ~4 test files, no src/ changes.
        os: ['ubuntu-latest', 'windows-latest']
        node_version: [20.9.0, lts/*, latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Get Node.js major version
        id: node-version
        shell: bash
        run: |
          NODE_MAJOR=$(node -v | cut -d'v' -f2 | cut -d'.' -f1)
          echo "major=$NODE_MAJOR" >> $GITHUB_OUTPUT
      - name: Install Corepack (Node 25+)
        if: ${{ fromJSON(steps.node-version.outputs.major) >= 25 }}
        run: npm install -g corepack --force
      - name: Enable Corepack
        run: corepack enable
      - name: cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashfiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn prettier
      - run: yarn lint
      - run: yarn build
      - run: yarn test:ci
      - run: yarn oclif manifest
      - run: yarn oclif readme
      - name: Check for uncommitted changes
        # We don't need to check on windows, which results in other differences as well
        if: matrix.os == 'ubuntu-latest'
        # NOTE: We expclude the arch type because CI runs on a different arc than our macs
        shell: bash
        run: |
          if ! git diff -I"linux-x64" -I"darwin-arm64" --quiet; then
            echo "Error: README is out of date. Please run 'yarn readme' and commit the changes."
            git diff -I"linux-x64" -I"darwin-arm64"
            exit 1
          fi

  # Contract test — qfg serve ↔ api-delivery (FIXTURE_DIR mode). Per bead
  # qfg-38sf.2 and plan §9. Lives as a separate job (not in the unit-tests
  # matrix) because (a) it needs the api-delivery Go binary, (b) it's
  # Linux-only — Go cross-compile + child_process semantics on Windows aren't
  # worth the complexity for a drift-defense check, (c) it must be a required
  # gate for release: release.yaml is gated on the whole `tests` workflow
  # succeeding, so adding the job here automatically blocks publish when the
  # contract is broken.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Clone api-delivery as a sibling (../api-delivery). Note: integration-test-data
      # is public, but api-delivery is PRIVATE — the default GITHUB_TOKEN can't read
      # it, so we use the QUONFIG_REPO_TOKEN PAT (same convention as
      # sdk-node/.github/workflows/chaos.yaml).
      - name: Clone api-delivery (sibling checkout)
        uses: actions/checkout@v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: api-delivery/go.mod
      - name: Build api-delivery binary
        # GOWORK=off because api-delivery is intentionally outside the
        # monorepo go.work (see api-delivery/CLAUDE.md). In CI there is no
        # go.work, but we set GOWORK=off defensively in case the developer
        # local-runs this step.
        env:
          GOWORK: off
        working-directory: api-delivery
        run: go build -o "$GITHUB_WORKSPACE/api-delivery-bin" ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: corepack enable
      - name: cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.yarn/cache
          key: ubuntu-latest-yarn-${{ hashfiles('**/yarn.lock') }}
          restore-keys: |
            ubuntu-latest-yarn-
      - run: yarn install --immutable
      - run: yarn build
      - name: Run contract test
        env:
          API_DELIVERY_BIN: ${{ github.workspace }}/api-delivery-bin
          NODE_ENV: test
        run: yarn mocha --forbid-only "test/contract/**/*.test.ts" --exit
