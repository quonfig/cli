name: Release Package
# Gated on the full `tests` workflow (test.yml). This workflow only triggers
# once `tests` has completed for a push to main, and every job below is
# additionally guarded on `tests` having concluded `success` — so publish
# blocks if the full `yarn test:ci` matrix (3 Node versions x 2 OS) is red.
#
# Previously this file re-ran an inline subset (prettier + lint + build +
# oclif manifest/readme + uncommitted-changes) and deliberately excluded
# `yarn test:ci` because the unit tests were red on the matrix. Those root
# causes are fixed (qfg-vcn2 + qfg-4tmh), so the inline subset is removed:
# test.yml already runs prettier/lint/build/test:ci/manifest/readme +
# the uncommitted-changes check across the matrix, against this same SHA.
on:
  workflow_run:
    workflows: ['tests']
    types: [completed]
    branches: [main]
jobs:
  check-version:
    runs-on: ubuntu-latest
    # Only proceed if the full tests workflow passed.
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      current-version: ${{ steps.check.outputs.current-version }}
      previous-version: ${{ steps.check.outputs.previous-version }}
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
      npm-tag: ${{ steps.check.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check if version needs publishing
        id: check
        run: |
          current_version=$(jq -r '.version' package.json)
          package_name=$(jq -r '.name' package.json)

          echo "current-version=$current_version" >> $GITHUB_OUTPUT

          # Check if this version exists on npm
          if npm view "${package_name}@${current_version}" version 2>/dev/null; then
            echo "Version $current_version already published to npm"
            echo "changed=false" >> $GITHUB_OUTPUT
            previous_version="$current_version"
          else
            echo "Version $current_version not found on npm, will publish"
            echo "changed=true" >> $GITHUB_OUTPUT
            # Get the latest published version for reference
            previous_version=$(npm view "${package_name}" version 2>/dev/null || echo "none")
          fi

          echo "previous-version=$previous_version" >> $GITHUB_OUTPUT

          # Check if this is a pre-release version
          if [[ "$current_version" =~ -(alpha|beta|rc|dev|pre|canary|next) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            tag="$(echo "$current_version" | cut -d'-' -f2)"
            echo "npm-tag=$tag" >> $GITHUB_OUTPUT
            echo "Detected pre-release version with tag: $tag"
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
            echo "Detected stable release version"
          fi

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [check-version]
    if: needs.check-version.outputs.version-changed == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      published-version: ${{ needs.check-version.outputs.current-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.11.0 --activate
      - name: cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashfiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn build
      - name: Get npm publish token via OIDC
        id: npm-token
        run: |
          OIDC_TOKEN=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value')
          NPM_TOKEN=$(curl -sf -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40quonfig%2Fcli" \
            | jq -r '.token')
          echo "::add-mask::$NPM_TOKEN"
          echo "token=$NPM_TOKEN" >> $GITHUB_OUTPUT
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-token.outputs.token }}
        run: |
          if [ "${{ needs.check-version.outputs.is-prerelease }}" == "true" ]; then
            npm publish --access public --tag ${{ needs.check-version.outputs.npm-tag }}
          else
            npm publish --access public
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: [check-version, build-and-publish]
    if: needs.build-and-publish.result == 'success' && needs.check-version.outputs.is-prerelease ==
      'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.current-version }}
          release_name: v${{ needs.check-version.outputs.current-version }}
          body: |
            See [CHANGELOG](https://github.com/quonfig/cli/blob/main/CHANGELOG.md) for details.

            Published to npm: [@quonfig/cli@${{ needs.check-version.outputs.current-version }}](https://www.npmjs.com/package/@quonfig/cli/v/${{ needs.check-version.outputs.current-version }})
          draft: false
          prerelease: false
