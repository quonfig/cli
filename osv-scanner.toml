reason = "http-cache-semantics <=4.2.0 shared-cache max-stale disclosure, no fixed release yet. Only pulled in by npm-registry HTTP clients (make-fetch-happen under npm/node-gyp, cacheable-request under the update-check plugin), each a private per-user cache; no shared multi-user HTTP cache. Tracked in qfg-66ko.8."

